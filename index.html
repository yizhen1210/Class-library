      @keyframes flashAttn {
        0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.55); transform: scale(1); }

      @keyframes flashReturn {
        0%, 100% { box-shadow: 0 0 0 0 rgba(5,150,105,0.55); transform: scale(1); }
        50% { box-shadow: 0 0 28px 7px rgba(5,150,105,0.9); transform: scale(1.05); }
      }
